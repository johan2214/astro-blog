# 👇 PÁGINA DE INICIO ACTUALIZADA
  - name: home
    label: Página de Inicio
    type: file
    path: src/content/pages/home.yml   # <- Debe coincidir con la subcarpeta
    format: yaml
    fields:
      - name: secciones
        label: Secciones de la página
        type: block
        list: true
        blockKey: type
        blocks:
          # --- HERO ---
          - name: hero
            label: Hero (Cabecera)
            fields:
              - { name: titulo, label: Título principal, type: string, required: true }
              - { name: subtitulo, label: Subtítulo, type: text }
              - { name: imagen_fondo, label: Imagen de fondo, type: image }
              - { name: texto_boton, label: Texto del botón, type: string }
              - { name: enlace_boton, label: Enlace del botón, type: string }

          # --- CARACTERÍSTICAS ---
          - name: caracteristicas
            label: Características
            fields:
              - { name: titulo_seccion, label: Título de la sección, type: string }
              - name: items
                label: Lista de características
                type: object
                list: true
                fields:
                  - { name: icono, label: Icono, type: image }
                  - { name: titulo_item, label: Título, type: string }
                  - { name: descripcion, label: Descripción, type: text }

          # --- TESTIMONIOS ---
          - name: testimonios
            label: Testimonios
            fields:
              - { name: titulo_seccion, label: Título de la sección, type: string }
              - name: items
                label: Lista de testimonios
                type: object
                list: true
                fields:
                  - { name: nombre, label: Nombre, type: string }
                  - { name: cargo, label: Cargo / Empresa, type: string }
                  - { name: texto, label: Testimonio, type: rich-text }
                  - { name: avatar, label: Avatar, type: image }

          # --- LLAMADA A LA ACCIÓN (CTA) ---
          - name: cta
            label: Llamada a la acción
            fields:
              - { name: titulo, label: Título, type: string }
              - { name: texto, label: Texto, type: text }
              - { name: texto_boton, label: Texto del botón, type: string }
              - { name: enlace_boton, label: Enlace del botón, type: string }